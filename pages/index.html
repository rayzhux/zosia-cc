    const catLabels = {
      "openclaw": "OpenClaw",
      "architecture": "Architecture",
      "devops": "CI/CD & DevOps",
      "health": "Health",
      "observability": "Observability",
      "zosia": "Zosia"
};
    let currentCat = "all";
    let currentView = "list";
    let currentSort = "newest";
    const container = document.getElementById("pagesContainer");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("search");

    function formatDate(d) {
      const date = new Date(d + "T00:00:00");
      return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function daysAgo(d) {
      const now = new Date("2026-03-18");
      const then = new Date(d);
      const diff = Math.floor((now - then) / 86400000);
      if (diff === 0) return "today";
      if (diff === 1) return "yesterday";
      return diff + "d ago";
    }

    function renderPages() {
      const query = searchInput.value.toLowerCase().trim();
      let filtered = pages.filter(p => {
        const catMatch = currentCat === "all" || p.cat === currentCat;
        const searchMatch = !query ||
          p.title.toLowerCase().includes(query) ||
          p.desc.toLowerCase().includes(query) ||
          p.slug.includes(query) ||
          p.tags.some(t => t.includes(query)) ||
          (catLabels[p.cat] || "").toLowerCase().includes(query);
        return catMatch && searchMatch;
      });

      if (currentSort === "newest") filtered.sort((a, b) => b.created.localeCompare(a.created));
      else if (currentSort === "updated") filtered.sort((a, b) => (b.updated || b.created).localeCompare(a.updated || a.created));
      else if (currentSort === "oldest") filtered.sort((a, b) => a.created.localeCompare(b.created));
      else filtered.sort((a, b) => a.title.localeCompare(b.title));

      resultCount.textContent = filtered.length + (filtered.length === 1 ? " page" : " pages");

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">No pages match your search.</div>';
        return;
      }

      container.className = currentView === "grid" ? "pages-grid" : "pages-list";
      container.innerHTML = filtered.map((p, i) => `
        <a href="/pages/${p.slug}" class="page-card" style="animation-delay:${i * 0.03}s">
          <div class="content">
            <div class="title-row">
              <div class="title">${p.title}</div>
            </div>
            <div class="desc">${p.desc}</div>
            <div class="meta-row">
              <span class="meta">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                ${formatDate(p.created)}
              </span>
              ${p.updated && p.updated !== p.created ? `<span class="meta">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                updated ${daysAgo(p.updated)}
              </span>` : `<span class="meta">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                ${daysAgo(p.created)}
              </span>`}
              <span class="tag">${catLabels[p.cat]}</span>
              ${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
            </div>
          </div>
        </a>
      `).join("");
    }

    // Search
    searchInput.addEventListener("input", renderPages);

    // Category filter
    document.getElementById("filters").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentCat = chip.dataset.cat;
      renderPages();
    });

    // View toggle
    document.querySelectorAll(".view-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        renderPages();
      });
    });

    // Sort
    document.getElementById("sortSelect").addEventListener("change", e => {
      currentSort = e.target.value;
      renderPages();
    });

    // Keyboard shortcut: / to focus search
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === "Escape") {
        searchInput.value = "";
        searchInput.blur();
        renderPages();
      }
    });

    renderPages();
  </script>
